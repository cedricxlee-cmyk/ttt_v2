<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe Game</title>
<style type='text/css'>
{
box-sizing: border-box;
}
h1 {
text-align: center;
color: #ff0000;
}
#turn {
text-align: center;
font-size: 20px;
margin: 20px;
}
#board{
display: flex;
flex-wrap: wrap;
width: 345px;
margin: 0 auto;
}
.square {
width: 100px;
height: 100px;
border: 2px solid black;
display: inline-block;
margin:  5px;
font-size: 60px;
text-align: center;
line-height: 100px;
vertical-align: top;
}
.square:hover {
background-color: #e0e0e0;
}
button, input[type='button'] {
display: block;
margin: 20px auto;
padding: 10px 20px;
font-size: 16px;
}
a {
display: block;
text-align: center;
margin: 20px;
}
</style>
</head>
<body>
<h1>Tic Tac Toe Game</h1>
<div id='turn'>X's Turn</div>
<div id='board'>

<script>
const NUM_SQUARES = 9;
for (i=0; i<NUM_SQUARES; i++)
{
  id = "sq"+i;
  document.write( "<div class='square' id='" + id + "'></div>" );
}
</script>

</div>

<script>
window.onload = function()
{
  var squares = document.querySelectorAll(".square");
  for (i=0; i<squares.length; i++)
  {
    squares[i].onclick = squareHandler;
  }
}

function squareHandler()
{
  this.innerHTML = "X";
  var index = this.id.substring(2);
  alert("Square number: " + index);
}
</script>

<input type='button' value='Start Game'>
<a href="https://en.wikipedia.org/wiki/Tic-tac-toe" target="_blank">Learn about Tic Tac Toe</a>
</body>
</html>
