// =============================================

document.write("<h2>Part 1: Menu using Associative Array</h2>");
document.write("<h3>Joe's Hotdogs Menu</h3>");

var menu = {
    hotdog:     4.00,
    fries:      3.50,
    soda:       1.50,
    sauerkraut: 1.00
};

var items = Object.keys(menu);
items.forEach(function(item) {
    document.write(item + " - $" + menu[item].toFixed(2) + "<br />");
});
