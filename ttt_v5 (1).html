<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe Game</title>
<style type='text/css'>
{
box-sizing: border-box;
}
h1 {
text-align: center;
color: #ff0000;
}
#turn {
text-align: center;
font-size: 20px;
margin: 20px;
}
#board{
display: flex;
flex-wrap: wrap;
width: 345px;
margin: 0 auto;
}
.square {
width: 100px;
height: 100px;
border: 2px solid black;
display: inline-block;
margin:  5px;
font-size: 60px;
text-align: center;
line-height: 100px;
vertical-align: top;
}
.square:hover {
background-color: #e0e0e0;
}
button, input[type='button'] {
display: block;
margin: 20px auto;
padding: 10px 20px;
font-size: 16px;
}
a {
display: block;
text-align: center;
margin: 20px;
}
</style>
</head>
<body>
<h1>Tic Tac Toe Game</h1>
<div id='turn'>X's Turn</div>
<div id='board'>

<script>
const NUM_SQUARES = 9;
for (i=0; i<NUM_SQUARES; i++)
{
  id = "sq"+i;
  document.write( "<div class='square' id='" + id + "'></div>" );
}
</script>

</div>

<script>
var currentPlayer;
var gameOver; // tracks whether the game has ended

window.onload = function()
{
  // hook up the start button once the page is ready
  document.getElementById('startBtn').onclick = startGame;

  // kick things off right away so the board is ready to play
  startGame();
}

function startGame()
{
  // reset this so players can click again after a win or stalemate
  gameOver = false;

  // wipe out whatever was on the board from the last game
  var squares = document.querySelectorAll(".square");
  for (i=0; i<squares.length; i++)
  {
    squares[i].innerHTML = "";
  }

  // flip a coin to decide who goes first - 50/50 chance
  if (Math.random() < 0.5)
  {
    currentPlayer = "X";
  }
  else
  {
    currentPlayer = "O";
  }

  // let the players know whose turn it is
  document.getElementById('turn').innerHTML = currentPlayer + "'s Turn";

  // attach the click handler to every square using forEach - from week 5 notes
  document.querySelectorAll(".square").forEach(function(square)
  {
    square.onclick = squareHandler;
  });
}

function squareHandler()
{
  // if someone already won or tied, ignore any clicks on the board
  if (gameOver)
  {
    return;
  }

  // don't let a player overwrite a square that already has X or O
  if (this.innerHTML != "")
  {
    return;
  }

  // put the current player's letter in the square they clicked
  this.innerHTML = currentPlayer;

  // use map() to go through all 9 squares and snapshot what's in each one
  // empty squares get a "-" so we can spot a stalemate later
  var ids = ["sq0","sq1","sq2","sq3","sq4","sq5","sq6","sq7","sq8"];
  var moves = ids.map(function(id)
  {
    var val = document.getElementById(id).innerHTML;
    if (val == "")
    {
      return "-";
    }
    else
    {
      return val;
    }
  });

  // all 8 ways you can win - 3 rows, 3 columns, 2 diagonals
  // I'm building each one as a string so I can just check for "XXX" or "OOO"
  var winConditions = [
    moves[0] + moves[1] + moves[2], // top row
    moves[3] + moves[4] + moves[5], // middle row
    moves[6] + moves[7] + moves[8], // bottom row
    moves[0] + moves[3] + moves[6], // left column
    moves[1] + moves[4] + moves[7], // middle column
    moves[2] + moves[5] + moves[8], // right column
    moves[0] + moves[4] + moves[8], // diagonal going down-right
    moves[2] + moves[4] + moves[6]  // diagonal going down-left
  ];

  // check if X got three in a row anywhere
  if (winConditions.includes("XXX"))
  {
    document.getElementById('turn').innerHTML = "X Wins!";
    gameOver = true;
    return;
  }

  // check if O got three in a row anywhere
  if (winConditions.includes("OOO"))
  {
    document.getElementById('turn').innerHTML = "O Wins!";
    gameOver = true;
    return;
  }

  // if there are no "-" left in moves, every square is filled and nobody won
  if (moves.indexOf("-") == -1)
  {
    document.getElementById('turn').innerHTML = "Stalemate! No winner.";
    gameOver = true;
    return;
  }

  // no winner yet - flip to the other player and keep going
  if (currentPlayer == "X")
  {
    currentPlayer = "O";
  }
  else
  {
    currentPlayer = "X";
  }

  // update the display so players know whose turn it is
  document.getElementById('turn').innerHTML = currentPlayer + "'s Turn";
}
</script>

<input type='button' value='Start Game' id='startBtn'>
<a href="https://en.wikipedia.org/wiki/Tic-tac-toe" target="_blank">Learn about Tic Tac Toe</a>
</body>
</html>
