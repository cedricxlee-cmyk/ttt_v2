<!DOCTYPE html>
<html>
<head>
  <title>JS Practice</title>
</head>
<body>
  <h1>JavaScript Practice Problems</h1>

  <script>
    // PROBLEM 1: The Multiplication Tool
    function timesTable(number) {
      // A loop that counts 1 to 12
      for (let i = 1; i <= 12; i++) {
        let result = number * i;
        document.write(number + " x " + i + " = " + result + "<br />");
      }
    }

    // TRIGGER 1: Get user input and run the tool
    let userNum = prompt("Enter a number for the times table:");
    timesTable(userNum);

    document.write("<hr />"); // Visual separator

    // PROBLEM 2: Temperature Converter
    function fahr2cels(ftemp) {
      // Logic: (F - 32) * 5/9
      let celsius = (ftemp - 32) * (5 / 9);
      return celsius; // "Hands back" the answer
    }

    // TRIGGER 2: Display results for a few values
    document.write("32F is " + fahr2cels(32) + "C <br />");
    document.write("212F is " + fahr2cels(212) + "C <br />");
    document.write("98.6F is " + fahr2cels(98.6) + "C");
  </script>
</body>
</html>
