<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe Game</title>
<style type='text/css'>
{
box-sizing: border-box;
}
h1 {
text-align: center;
color: #ff0000;
}
#turn {
text-align: center;
font-size: 20px;
margin: 20px;
}
#board{
display: flex;
flex-wrap: wrap;
width: 345px;
margin: 0 auto;
}
.square {
width: 100px;
height: 100px;
border: 2px solid black;
display: inline-block;
margin:  5px;
font-size: 60px;
text-align: center;
line-height: 100px;
vertical-align: top;
}
.square:hover {
background-color: #e0e0e0;
}
button, input[type='button'] {
display: block;
margin: 20px auto;
padding: 10px 20px;
font-size: 16px;
}
a {
display: block;
text-align: center;
margin: 20px;
}
</style>
</head>
<body>
<h1>Tic Tac Toe Game</h1>
<div id='turn'>X's Turn</div>
<div id='board'>

<script>
const NUM_SQUARES = 9;
for (i=0; i<NUM_SQUARES; i++)
{
  id = "sq"+i;
  document.write( "<div class='square' id='" + id + "'></div>" );
}
</script>

</div>

<script>
var currentPlayer;

window.onload = function()
{
  // Randomly choose whether X or O starts
  if (Math.random() < 0.5)
  {
    currentPlayer = "X";
  }
  else
  {
    currentPlayer = "O";
  }

  // Display whose turn it is
  document.getElementById('turn').innerHTML = currentPlayer + "'s Turn";

  // Assign event handler to all squares
  var squares = document.querySelectorAll(".square");
  for (i=0; i<squares.length; i++)
  {
    squares[i].onclick = squareHandler;
  }

  // Assign event handler to Start Game button
  document.getElementById('startBtn').onclick = startGame;
}

function squareHandler()
{
  // If square is already taken, do nothing
  if (this.innerHTML != "")
  {
    return;
  }

  // Place the current player's symbol
  this.innerHTML = currentPlayer;

  // Build the moves array using map()
  // Each element is the X or O in that square, or "-" if empty
  var ids = ["sq0","sq1","sq2","sq3","sq4","sq5","sq6","sq7","sq8"];
  var moves = ids.map(function(id)
  {
    var val = document.getElementById(id).innerText;
    if (val == "")
    {
      return "-";
    }
    else
    {
      return val;
    }
  });

  // Build the winConditions array of 8 strings (3 across, 3 down, 2 diagonal)
  var winConditions = [
    moves[0] + moves[1] + moves[2], // top row
    moves[3] + moves[4] + moves[5], // middle row
    moves[6] + moves[7] + moves[8], // bottom row
    moves[0] + moves[3] + moves[6], // left column
    moves[1] + moves[4] + moves[7], // middle column
    moves[2] + moves[5] + moves[8], // right column
    moves[0] + moves[4] + moves[8], // diagonal top-left to bottom-right
    moves[2] + moves[4] + moves[6]  // diagonal top-right to bottom-left
  ];

  // Switch turns
  if (currentPlayer == "X")
  {
    currentPlayer = "O";
  }
  else
  {
    currentPlayer = "X";
  }

  // Update the turn display
  document.getElementById('turn').innerHTML = currentPlayer + "'s Turn";
}

function startGame()
{
  // Clear all squares
  var squares = document.querySelectorAll(".square");
  for (i=0; i<squares.length; i++)
  {
    squares[i].innerHTML = "";
  }

  // Randomly choose who starts
  if (Math.random() < 0.5)
  {
    currentPlayer = "X";
  }
  else
  {
    currentPlayer = "O";
  }

  // Update the turn display
  document.getElementById('turn').innerHTML = currentPlayer + "'s Turn";
}
</script>

<input type='button' value='Start Game' id='startBtn'>
<a href="https://en.wikipedia.org/wiki/Tic-tac-toe" target="_blank">Learn about Tic Tac Toe</a>
</body>
</html>
